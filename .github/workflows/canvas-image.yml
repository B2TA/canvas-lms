name: Build and publish Canvas image

on:
  push:
    branches:
      - ci/ghcr-multiarch-image
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: latest
        type: string
      amd64_runner:
        description: Runner label for the native amd64 build
        required: true
        default: ubuntu-24.04
        type: string
      arm64_runner:
        description: Runner label for the native arm64 build
        required: true
        default: ubuntu-24.04-arm
        type: string

concurrency:
  group: canvas-image-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/b2ta/canvas-lms
  POSTGRES_CLIENT: "18"

jobs:
  build-amd64:
    name: Build linux/amd64 image
    runs-on: ${{ inputs.amd64_runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          push: true
          pull: true
          build-args: |
            POSTGRES_CLIENT=${{ env.POSTGRES_CLIENT }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}-amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

  build-arm64:
    name: Build linux/arm64 image
    runs-on: ${{ inputs.arm64_runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/arm64
          push: true
          pull: true
          build-args: |
            POSTGRES_CLIENT=${{ env.POSTGRES_CLIENT }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || 'latest' }}-arm64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

  publish-manifest:
    name: Publish multi-architecture tag
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
            "${IMAGE_NAME}:${IMAGE_TAG}-arm64"
